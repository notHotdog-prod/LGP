<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <!-- Circle -->
  <circle cx="60" cy="60" r="46" stroke="url(#grad)" stroke-width="4" fill="none"/>
  <!-- Arrow going up-right from circle -->
  <line x1="42" y1="78" x2="88" y2="22" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <polyline points="72,20 90,20 90,38" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- grow. text inside circle -->
  <text x="36" y="68" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="24" font-weight="700" fill="url(#grad)">grow.</text>
  <!-- lets grow patients.com -->
  <text x="122" y="42" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="300" fill="#c084fc">lets</text>
  <text x="122" y="72" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="300" fill="#c084fc">grow</text>
  <text x="122" y="102" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">patients.com</text>
</svg>
